[package]
name = "vigilode-nonstiff-diffsol-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
diffsol = { version = "=0.16.1", default-features = false, features = ["faer"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[profile.measurement]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16

[workspace]
