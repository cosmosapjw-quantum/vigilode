[package]
name = "vigilode-sg01"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sg01_bench"
path = "src/bin/sg01_bench.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1

[[bin]]
name = "sg01_oracle"
path = "src/bin/sg01_oracle.rs"

[[bin]]
name = "sg01_profile"
path = "src/bin/sg01_profile.rs"
