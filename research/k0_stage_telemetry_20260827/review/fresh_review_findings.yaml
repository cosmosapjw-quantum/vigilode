finding:
  severity: P0
  file: research/k0_stage_telemetry_20260827/aggregate/build_k0_aggregate.py
  line_or_symbol: "summarize_cell/totals_by_kernel, lines 44-96; main, lines 313-360"
  violated_invariant: INV-K0-005
  reproducer: |
    PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
    import importlib.util, json
    from pathlib import Path

    root = Path(".")
    def module(name, path):
        spec = importlib.util.spec_from_file_location(name, path)
        mod = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(mod)
        return mod

    runner = module("runner", root / "research/k0_stage_telemetry_20260827/aggregate/run_k0_campaign_cell.py")
    validator = module("validator", root / "research/k0_stage_telemetry_20260827/schema/validate_k0_cells.py")
    builder = module("builder", root / "research/k0_stage_telemetry_20260827/aggregate/build_k0_aggregate.py")
    authority = json.loads((root / "research/k0_stage_telemetry_20260827/aggregate/campaign-authority.json").read_text())
    cell = runner.failure_cell(
        authority, "robertson-ramped", "legacy-restarted-gmres",
        "SCIENTIFIC_COMMAND_ERROR", "injected",
    )
    print("validator_state=", validator.validate_cell(
        cell, ("legacy-restarted-gmres", "robertson-ramped"), "injected"
    ))
    summary = builder.summarize_cell(cell)
    print("summary_a1_attempts=", summary["a1_attempts"])
    print(builder.totals_by_kernel([summary], ("legacy-restarted-gmres",)))
    PY
    Observed: validator_state=ERROR and summary_a1_attempts=None, followed by TypeError from int(None) at totals_by_kernel line 92.
  explanation: "A validator-valid preserved ERROR cell has null A1 totals. Aggregation crashes before writing failure_ledger.json, so an actual failed cell cannot be preserved in the required aggregate."

