finding:
  severity: P1
  file: docs/exec-plans/k0-stage-telemetry-integration-20260827/schemas/stage-receipt.schema.json
  line_or_symbol: "required/properties declarations, lines 7-16, 83-113, and 149-153"
  violated_invariant: INV-K0-005
  reproducer: |
    PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
    import json
    from pathlib import Path
    from jsonschema import Draft202012Validator

    schema = json.loads(Path(
        "docs/exec-plans/k0-stage-telemetry-integration-20260827/schemas/stage-receipt.schema.json"
    ).read_text())
    base = {
        "schema": "vigilode-k0-stage-receipt/v1",
        "case_id": "case",
        "family": "family",
        "kernel_arm": "legacy-restarted-gmres",
        "attempt_id": 0,
        "stage_index": 0,
        "claim_class": "EXPLORATORY_NONAUTHORITATIVE",
    }
    for state in ("ERROR", "STOP_INVALID"):
        receipt = {**base, "execution_state": state}
        errors = list(Draft202012Validator(schema).iter_errors(receipt))
        print(state, "ACCEPTED" if not errors else "REJECTED", len(errors))
    PY
    Observed: ERROR ACCEPTED 0 and STOP_INVALID ACCEPTED 0.
  explanation: "The canonical schema has no state-dependent work/error requirements, so it accepts information-free failed receipts. This reproduces WU-01 FM-WU01-002, which assigns P1 to missing preserved failure work."

