finding:
  severity: P0
  file: tools/verify-k0-stage-telemetry-plan-base.py
  line_or_symbol: "evidence_check, lines 148-171"
  violated_invariant: INV-K0-010
  reproducer: |
    PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
    import json, pathlib, subprocess, tempfile
    root = pathlib.Path.cwd()
    with tempfile.TemporaryDirectory(prefix="k0-invalid-evidence-") as raw:
        evidence = pathlib.Path(raw)
        for i in range(12):
            (evidence / f"{i}.json").write_text(json.dumps({
                "execution_state": "COMPLETE",
                "kernel_arm": f"not-a-frozen-kernel-{i}",
                "family": f"not-a-frozen-family-{i}",
                "tolerance": {"rtol": 1e-10, "atol": 1e-12},
                "stages": [],
            }))
        result = subprocess.run([
            "python", "tools/verify-k0-stage-telemetry-plan.py",
            "--repo-root", ".", "--evidence-dir", str(evidence),
        ], cwd=root, text=True, capture_output=True)
        print("exit=", result.returncode)
        print(result.stdout)
    PY
    Observed: exit=0 and status=PASS for twelve invented kernel/family identities whose COMPLETE cells have no stages.
  explanation: "The mandatory frozen-matrix gate checks only cardinality, arbitrary identity uniqueness, tolerance numbers, and optional work sums. It therefore accepts no actual frozen family, kernel, or stage evidence, violating the explicitly P0 exact-2x6 requirement."

