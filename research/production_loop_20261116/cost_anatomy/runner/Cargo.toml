[package]
name = "v04-cost-anatomy-runner"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone measurement program of loop L1 node V04_STAGE_COST_ANATOMY (see ../PREDECLARED.json).
# It is not a member of the repository workspace and changes no crate source.
[workspace]

[dependencies]
rodas5p-core = { path = "../../../../crates/rodas5p-core" }
rodas5p-integrators = { path = "../../../../crates/rodas5p-integrators" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# The release profile of the repository workspace (root Cargo.toml), repeated because a standalone
# package does not inherit it: the protected drivers are measured as the workspace builds them.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Fast compile for smoke tests of the runner only; no recorded run uses it.
[profile.smoke]
inherits = "release"
lto = false
codegen-units = 16
