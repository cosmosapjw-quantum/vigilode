[package]
name = "v18-dense-lu-runner"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone measurement program of loop L1 node V18_DENSE_LU_CLIENT (see ../PREDECLARED.json).
# It is not a member of the repository workspace and changes no crate source.
[workspace]

[dependencies]
rodas5p-core = { path = "../../../../crates/rodas5p-core" }
rodas5p-integrators = { path = "../../../../crates/rodas5p-integrators" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# The release profile of the repository workspace (root Cargo.toml), repeated because a standalone
# package does not inherit it: the protected driver is measured as the workspace builds it.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
