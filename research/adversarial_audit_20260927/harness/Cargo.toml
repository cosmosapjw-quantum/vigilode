[package]
name = "vigilode-audit-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[dependencies]
rodas5p-core = { path = "../../../crates/rodas5p-core" }
rodas5p-krylov = { path = "../../../crates/rodas5p-krylov" }
rodas5p-integrators = { path = "../../../crates/rodas5p-integrators" }
rodas5p-fair-ab = { path = "../../../crates/rodas5p-fair-ab" }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg", "sparse-linalg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"
hex = "0.4.3"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# identical to the tree's measurement profile
[profile.measurement]
inherits = "release"
lto = false
codegen-units = 16

# standalone: not a member of the repository workspace
[workspace]
