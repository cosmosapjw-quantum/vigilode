[package]
name = "rodas5p-integrators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
audit2-research = []
audit2-bateman-authority = ["audit2-research", "dep:serde_json"]
audit2-stage-certificate = ["audit2-research", "dep:serde_json", "dep:sha2"]
# Research-gate modules (stage-lattice task SL-N6): off in the production build; the
# self dev-dependency turns them on for this crate's own tests, examples and benches.
research-gates = ["rodas5p-core/research-gates"]

[dependencies]
faer.workspace = true
rodas5p-core = { path = "../rodas5p-core" }
rodas5p-krylov = { path = "../rodas5p-krylov" }
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
rodas5p-integrators = { path = ".", features = ["research-gates"] }
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "audit0930_reuse_certificate_contracts"
path = "tests/audit0930_reuse_certificate_contracts.rs"
required-features = ["audit2-research"]

[[test]]
name = "audit2_structured_correction_contracts"
path = "tests/audit2_structured_correction_contracts.rs"
required-features = ["audit2-research"]

[[test]]
name = "audit2_real_client_authority_contracts"
path = "tests/audit2_real_client_authority_contracts.rs"
required-features = ["audit2-bateman-authority"]

[[test]]
name = "audit2_stage_certificate_contracts"
path = "tests/audit2_stage_certificate_contracts.rs"
required-features = ["audit2-stage-certificate"]

[[example]]
name = "audit2_bateman_local_six_case"
path = "examples/audit2_bateman_local_six_case.rs"
required-features = ["audit2-bateman-authority"]
