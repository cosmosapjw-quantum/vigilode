[package]
name = "rodas5p-integrators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
audit2-research = []
audit2-bateman-authority = ["audit2-research", "dep:serde_json"]

[dependencies]
faer.workspace = true
rodas5p-core = { path = "../rodas5p-core" }
rodas5p-krylov = { path = "../rodas5p-krylov" }
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "audit2_structured_correction_contracts"
path = "tests/audit2_structured_correction_contracts.rs"
required-features = ["audit2-research"]

[[test]]
name = "audit2_real_client_authority_contracts"
path = "tests/audit2_real_client_authority_contracts.rs"
required-features = ["audit2-bateman-authority"]

[[example]]
name = "audit2_bateman_local_six_case"
path = "examples/audit2_bateman_local_six_case.rs"
required-features = ["audit2-bateman-authority"]
