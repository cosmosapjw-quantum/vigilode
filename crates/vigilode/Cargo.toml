[package]
name = "vigilode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Production facade over the protected RODAS5P drivers: one Problem / Options / Solve / Solution surface."

[features]
retro-dictionary = ["rodas5p-core/retro-dictionary", "rodas5p-integrators/retro-dictionary"]
polynomial-events = ["retro-dictionary", "rodas5p-integrators/polynomial-events"]
structured = ["dep:vigilode-coupled"]

[dependencies]
vigilode-coupled = { path = "../vigilode-coupled", optional = true }
rodas5p-core = { path = "../rodas5p-core" }
rodas5p-integrators = { path = "../rodas5p-integrators" }
serde.workspace = true
thiserror.workspace = true
rayon.workspace = true
rustfft.workspace = true

rodas5p-krylov = { path = "../rodas5p-krylov" }

[dev-dependencies]
serde_json.workspace = true
