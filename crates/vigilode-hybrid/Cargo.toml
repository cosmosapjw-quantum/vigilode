[package]
name = "vigilode-hybrid"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
build = "build.rs"

[features]
default = ["native"]
native = ["dep:rodas5p-core", "dep:rodas5p-integrators", "dep:vigilode-coupled", "dep:serde", "dep:serde_json"]
external = ["native", "dep:diffsol"]

[dependencies]
rodas5p-core = { path = "../rodas5p-core", optional = true }
rodas5p-integrators = { path = "../rodas5p-integrators", optional = true }
vigilode-coupled = { path = "../vigilode-coupled", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"], optional = true }
diffsol = { version = "=0.16.1", default-features = false, features = ["faer"], optional = true }

[[example]]
name = "hybrid_bench"
required-features = ["external"]

[profile.measurement]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 1

[workspace]
