[package]
name = "vigilode-a07"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[dependencies]
diffsol = { version = "=0.16.1", default-features = false, features = ["faer"] }
rodas5p-core = { path = "../../../../crates/rodas5p-core" }
rodas5p-integrators = { path = "../../../../crates/rodas5p-integrators" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[features]
allocation-audit = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.measurement]
inherits = "release"
lto = false
codegen-units = 16

[workspace]
