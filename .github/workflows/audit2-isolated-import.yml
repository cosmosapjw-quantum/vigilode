name: audit2-isolated-import
on:
  pull_request:
    branches: ['connectivity/audit2-20260829-base']
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 93fe348ce36859dd5f78b31267d771ea9c054677
          persist-credentials: false
      - name: Export exact inspected source without execution
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git archive --format=tar.gz -o source-93fe348.tar.gz HEAD
          sha256sum source-93fe348.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: audit2-source-93fe348
          path: source-93fe348.tar.gz
          retention-days: 7
