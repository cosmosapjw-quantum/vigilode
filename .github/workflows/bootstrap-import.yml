name: Bootstrap durable VigilODE source

on:
  push:
    branches:
      - bootstrap/import-v3.5-durable-baseline
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/import-v3.5-durable-baseline
          fetch-depth: 0

      - name: Wait until every chunk is present
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .bootstrap -maxdepth 1 -name 'source.b64.*' -type f 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ne 10 ]; then
            echo "Need 10 chunks; currently have $count. Nothing to do."
          fi

      - name: Reassemble, verify, and unpack source
        if: steps.chunks.outputs.count == '10'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.* | base64 -d > /tmp/vigilode-src.tar.gz
          echo '5295fd5dfe59da9053f0ea93dfd4f313bff44da852519acf5cf1c0ecf3ae0e46  /tmp/vigilode-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/vigilode-src.tar.gz -C .
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = 'b6ed82be4e09045fbda4ba8b1a8782daef8840220baf88935d36a7046433afb4'
          rm -rf .bootstrap .github/workflows/bootstrap-import.yml

      - name: Commit expanded durable baseline
        if: steps.chunks.outputs.count == '10'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: expand durable v3.5 source baseline'
          git push origin HEAD:bootstrap/import-v3.5-durable-baseline
