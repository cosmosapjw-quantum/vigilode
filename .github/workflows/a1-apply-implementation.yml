name: A1 one-shot implementation transaction

on:
  push:
    branches:
      - research/a1-inner-tolerance-parity
    paths:
      - ".github/workflows/a1-apply-implementation.yml"
      - "tools/apply-a1-inner-tolerance.py"

permissions:
  contents: write

jobs:
  apply-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact transaction head
        uses: actions/checkout@v4
        with:
          ref: research/a1-inner-tolerance-parity
          fetch-depth: 0

      - name: Apply the bounded A1 patch
        run: |
          python3 tools/apply-a1-inner-tolerance.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/rodas5p-integrators/src/g4_s5b0_regime_atlas.rs")
          text = path.read_text(encoding="utf-8")
          old = "ControllerKind, FusedPhiKrylovConfig,\n"
          new = "ControllerKind, FusedOrthogonalization,\n    FusedPhiKrylovConfig,\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one post-patch import match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format with the pinned toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          cargo +1.94.1 fmt --all

      - name: Remove one-shot transaction machinery
        run: |
          rm .github/workflows/a1-apply-implementation.yml
          rm tools/apply-a1-inner-tolerance.py

      - name: Verify the bounded commit surface
        run: |
          git diff --check
          git add -A
          git diff --cached --name-status
          python3 - <<'PY'
          import subprocess
          expected = {
              "M\tcrates/rodas5p-integrators/src/g4_s5b0_regime_atlas.rs",
              "A\tcrates/rodas5p-integrators/src/g4_s5b0_inner_tolerance.rs",
              "M\tcrates/rodas5p-integrators/src/lib.rs",
              "D\t.github/workflows/a1-apply-implementation.yml",
              "D\ttools/apply-a1-inner-tolerance.py",
          }
          observed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-status"], text=True
              ).splitlines()
          )
          if observed != expected:
              raise SystemExit(f"unexpected A1 commit surface: {sorted(observed)}")
          PY

      - name: Commit and push the production correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: unify G4/S5B0 inner tolerance policy"
          git push origin HEAD:research/a1-inner-tolerance-parity
