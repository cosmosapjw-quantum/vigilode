name: Production CI

# Builds and tests the production crates (vigilode facade and the crates under
# it) on the toolchain pinned in rust-toolchain.toml; the job test-cli-fair-ab
# also tests the other workspace members (rodas5p-fair-ab, rodas5p-cli). That
# pin equals the workspace rust-version, so every job here is also the MSRV
# check.
#
# The test job does not re-run the whole suite at every push (owner decisions
# OD-L1-19, OD-L1-20 and OD-L1-21): tools/ci/select_tests.py runs the test
# targets whose measured inputs changed since the last complete run of this
# job, targets without a measurement and the targets that failed in that run.
# Every run measures the inputs of the targets it runs (rustc dep-info,
# coverage, and the files the test processes open, traced with strace) and
# hands the map to the next run. The whole suite runs on main, when it is asked
# for (workflow_dispatch with full), when no baseline or map is known, when the
# runner image or the pull-request base changed since the baseline and when a
# global file changes (workspace manifest or lock file, toolchain, .cargo/,
# tools/ci/, a .gitattributes file, this file). The owner runs the whole suite
# before a release.
#
# No path filter on the triggers: a measured input can be any tracked file
# (research/, docs/, fixtures/, tools/ and more), and a run whose changes
# affect no test ends after the selection step.

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the whole suite instead of the change-based selection'
        type: boolean
        default: true
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # The test job reads earlier runs of this workflow and their outcome
  # artifacts to find the baseline of its selection.
  actions: read

# Concurrency is set per job. The short jobs cancel superseded runs on
# pull-request refs (every commit on main keeps its own result). The test job
# queues instead (OD-L1-21): a cancelled test job keeps only the targets it
# finished, so the next run would repeat the rest; GitHub keeps the newest
# pending run of the group, so pushes coalesce and the queued run's baseline is
# the run that just finished.
#
# A selection that does not fit into the job limit still seeds the next run
# (owner decision OD-L1-29): the run step writes the outcome and the input map
# after every target, stops at its time budget (10 minutes under the job
# limit: on hosted runners the measurement of one target took at most 72.5 s
# and the steps after the run step at most 2 s each, V4_NOTES R40), and the
# save step runs also when the job is cancelled. A run that its budget stops
# fails after saving; the next run maps the targets that were measured and runs
# the others, the stopped one last.

# The test job is the gate of the production crates. The job test-cli-fair-ab
# runs the non-ignored tests of the other two workspace members, rodas5p-fair-ab
# and rodas5p-cli, with the same selection and its own outcome artifact: the
# workspace test closure of a1-inner-tolerance-parity.yml, their only other
# run, was removed (OD-L1-21), and a job of its own keeps their full run out of
# the time budget of the gate. Their ignored tests run in ignored-tests.yml.
# fmt and clippy below cover the production crates only. Not tested here:
# vigilode-hybrid and vigilode-bench, which are not workspace members
# (vigilode-hybrid: hybrid-structure-ad-20261020.yml on a research branch;
# vigilode-bench: the bench job below).

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-fmt-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: root
      - name: Format check
        run: cargo fmt --check -p vigilode -p rodas5p-core -p rodas5p-krylov -p rodas5p-integrators

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-clippy-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: root
      # Check the facade and core explicitly. --no-deps limits each invocation
      # to the named packages; the integrator runtime has its own test gate.
      - name: Clippy
        run: cargo clippy -p vigilode -p rodas5p-core --all-targets --locked --no-deps -- -D warnings

  test:
    runs-on: ubuntu-latest
    # A full run executes every target with coverage instrumentation and
    # strace; a selection is much shorter.
    timeout-minutes: 300
    # Queued, never cancelled (OD-L1-21): see the note above the jobs.
    concurrency:
      group: production-test-${{ github.ref }}
      cancel-in-progress: false
    # Coverage instrumentation (OD-L1-20): every selected target records the
    # source files it executes. Branch, heads and the full flag reach the
    # scripts through the environment, never expanded inside a script.
    env:
      RUSTFLAGS: '-C instrument-coverage'
      RUSTDOCFLAGS: '-C instrument-coverage'
      LLVM_PROFILE_FILE: '${{ github.workspace }}/../coverage-unused/%p-%m.profraw'
      BRANCH: ${{ github.head_ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || github.ref == 'refs/heads/main' }}
    steps:
      # The time budget of the run step counts from the start of the job
      # (OD-L1-29); this is the first step.
      - name: Record the start of the job
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools
          rustup override set "$RUST_TOOLCHAIN"
      # The selector traces the files that the test processes open (OD-L1-21).
      # Without strace it still runs every selected test, records why it could
      # not trace and leaves those targets unmapped, so the next run measures
      # them again: a failed installation does not stop the job.
      - name: Install strace
        continue-on-error: true
        run: |
          command -v strace >/dev/null || { sudo apt-get update && sudo apt-get install -y strace; }
          strace -V | head -n 1
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: root
      - name: Self-test of the test selection
        run: python3 -u tools/ci/select_tests.py self-test
      # The baseline is the newest complete run of this job on this branch, of
      # the same event and repository, at an ancestor of the head, that ran on
      # the same runner image (hosted runners serve several image versions at
      # once); with none on this image, the newest on another image, and the
      # selection runs the whole suite.
      - name: Baseline of the test selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u tools/ci/select_tests.py baseline --workflow production.yml --artifact ci-test-outcome-test --branch "$BRANCH" --run-id "$GITHUB_RUN_ID" --head "$HEAD_SHA" --out baseline.json
      # Packages of the production gate; whole packages in full mode (lib,
      # integration and doc tests), so a new test target needs no edit here.
      # #[ignore]d tests run in ignored-tests.yml. The pull-request base of the
      # checked-out merge commit and the runner image (ImageOS, ImageVersion)
      # are recorded; a change of either since the baseline runs the whole
      # suite.
      - name: Select the tests
        run: python3 -u tools/ci/select_tests.py select --baseline baseline.json --head "$HEAD_SHA" --pr-base "$PR_BASE" --workflow-file .github/workflows/production.yml --full "$FULL" --out selection.json --scope rodas5p-core rodas5p-krylov rodas5p-integrators vigilode vigilode-coupled
      # One cargo test --no-fail-fast per target, measured: a failing test
      # binary does not hide the binaries after it, and every target runs.
      # Time budget: 290 of the 300 minutes (see the note above the jobs; the
      # full v3 run took 276 minutes on a hosted runner).
      - name: Run the selected tests
        run: python3 -u tools/ci/select_tests.py run --selection selection.json --mode normal --measure --baseline baseline.json --work-dir "$RUNNER_TEMP/ci-measure" --map-out map.json --outcome outcome.json --budget-minutes 290 --started-at "$JOB_STARTED_AT"
      # The outcome (failing targets, the units not run; complete = every
      # selected command ran its tests) and the input map are the baseline of
      # the next run of this job, also when this job is cancelled (OD-L1-29).
      - name: Keep the outcome and the input map for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-outcome-test
          path: |
            outcome.json
            selection.json
            map.json
          if-no-files-found: ignore
          overwrite: true

  # The non-ignored tests of rodas5p-fair-ab and rodas5p-cli (see the note
  # above the jobs), selected and measured like the test job, with their own
  # baseline: the artifact ci-test-outcome-test-cli-fair-ab.
  test-cli-fair-ab:
    runs-on: ubuntu-latest
    # The hosted workspace closure of A1 ran these tests in about 14 minutes
    # (debug, no coverage, run 45358324393); a full run here adds the build,
    # coverage instrumentation and strace.
    timeout-minutes: 120
    # Queued, never cancelled (OD-L1-21): see the note above the jobs.
    concurrency:
      group: production-test-cli-fair-ab-${{ github.ref }}
      cancel-in-progress: false
    env:
      RUSTFLAGS: '-C instrument-coverage'
      RUSTDOCFLAGS: '-C instrument-coverage'
      LLVM_PROFILE_FILE: '${{ github.workspace }}/../coverage-unused/%p-%m.profraw'
      BRANCH: ${{ github.head_ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || github.ref == 'refs/heads/main' }}
    steps:
      # As in the test job: the time budget counts from here (OD-L1-29).
      - name: Record the start of the job
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools
          rustup override set "$RUST_TOOLCHAIN"
      # As in the test job: without strace the targets stay unmapped.
      - name: Install strace
        continue-on-error: true
        run: |
          command -v strace >/dev/null || { sudo apt-get update && sudo apt-get install -y strace; }
          strace -V | head -n 1
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: root
      - name: Self-test of the test selection
        run: python3 -u tools/ci/select_tests.py self-test
      - name: Baseline of the test selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u tools/ci/select_tests.py baseline --workflow production.yml --artifact ci-test-outcome-test-cli-fair-ab --branch "$BRANCH" --run-id "$GITHUB_RUN_ID" --head "$HEAD_SHA" --out baseline.json
      - name: Select the tests
        run: python3 -u tools/ci/select_tests.py select --baseline baseline.json --head "$HEAD_SHA" --pr-base "$PR_BASE" --workflow-file .github/workflows/production.yml --full "$FULL" --out selection.json --scope rodas5p-fair-ab rodas5p-cli
      # Time budget: 110 of the 120 minutes (see the note above the jobs; the
      # full v3 run took 41 minutes on a hosted runner).
      - name: Run the selected tests
        run: python3 -u tools/ci/select_tests.py run --selection selection.json --mode normal --measure --baseline baseline.json --work-dir "$RUNNER_TEMP/ci-measure" --map-out map.json --outcome outcome.json --budget-minutes 110 --started-at "$JOB_STARTED_AT"
      - name: Keep the outcome and the input map for the next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-outcome-test-cli-fair-ab
          path: |
            outcome.json
            selection.json
            map.json
          if-no-files-found: ignore
          overwrite: true

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-docs-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: root
      - name: Rustdoc without warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p vigilode -p vigilode-coupled --no-deps --locked
      - name: Doc tests
        run: cargo test -p vigilode -p vigilode-coupled --doc --locked
      - name: Build the examples
        run: cargo build -p vigilode --examples --locked
      - name: Run the examples
        run: |
          set -e
          for ex in robertson dense_output dae_mass banded_fd; do
            cargo run -p vigilode --example "$ex" --locked
          done
      - name: Run the serialized RHS-first deployment profiles
        run: |
          set -euo pipefail
          cargo run -p vigilode --example production_from_json --locked -- --template rhs-only > /tmp/vigilode-rhs-only.json
          cargo run -p vigilode --example production_from_json --locked -- --template selective-jvp > /tmp/vigilode-selective-jvp.json
          for mode in rhs-only selective-jvp; do
            for rate in 1 1000; do
              cargo run -p vigilode --example production_from_json --locked -- "/tmp/vigilode-$mode.json" "$rate"
            done
          done

  semver:
    # --baseline-rev needs the pull request's base sha, which a push to main
    # does not have.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production-semver-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # Non-blocking until the first published 0.x baseline; plan G-A makes it
    # blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: root
      - name: Install cargo-semver-checks
        run: cargo install --locked --version 0.51.0 cargo-semver-checks
      - name: Semver check against the base commit
        run: >-
          cargo semver-checks
          --baseline-rev ${{ github.event.pull_request.base.sha }}
          -p vigilode

  bench:
    # ubuntu-24.04 ships SUNDIALS 6.4.1, the CVODE version the comparator
    # bridge (crates/vigilode-bench/native/bridge) is written for and the
    # benchmark evidence was produced with. ubuntu-26.04 ships SUNDIALS 7.1.1:
    # its headers include mpi.h and no longer define the types the bridge
    # uses, so the bridge does not compile there.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: production-bench-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          shared-key: bench
          workspaces: crates/vigilode-bench
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libsundials-dev
      - name: Bench crate tests
        run: cargo test --manifest-path crates/vigilode-bench/Cargo.toml --locked
