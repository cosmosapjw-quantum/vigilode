name: BASS21 original geodesic Liouville source-free witness (no owner NPZ)
on:
  pull_request:
    paths:
      - 'research/bass21_geodesic_liouville_20261031/**'
      - '.github/workflows/bass21-geodesic-sourcefree-20261031.yml'
  push:
    branches: [research/bass21-geodesic-liouville-optical-depth-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geodesic-real-numeric-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify genuine owner source endpoint invariants (NOT full owner replay)
        run: python3 research/bass21_geodesic_liouville_20261031/code/sourcefree_check.py
