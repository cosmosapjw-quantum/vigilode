name: PR19 bounded scale-invariant backsolve autopatch

on:
  push:
    branches:
      - research/a2-a3-gmres-inner-cycle-givens
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-bounded-correction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@v4
        with:
          fetch-depth: 16

      - name: Verify immutable correction source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3b057f8cbae4062df5ea08bc4c150b07315d08d9 HEAD
          test "$(git hash-object crates/rodas5p-krylov/src/gmres_givens.rs)" = "6568a4989666ec851753fd8d3aee9ff9293b210a"

      - name: Apply one-file scale-invariance correction and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("crates/rodas5p-krylov/src/gmres_givens.rs")
          workflow_path = Path(".github/workflows/pr19-scale-invariant-backsolve-autopatch.yml")
          text = source_path.read_text(encoding="utf-8")

          old = '''        .fold(0.0, f64::max)
                  .max(1.0);
              let diagonal_tolerance = 100.0 * f64::EPSILON * diagonal_scale;
          '''
          new = '''        .fold(0.0, f64::max);
              if !diagonal_scale.is_finite() {
                  return Err(CoreError::NonFinite(
                      "GMRES incremental triangular factor scale is NaN/Inf".into(),
                  ));
              }
              if diagonal_scale == 0.0 {
                  return Err(CoreError::LinearSolve(
                      "GMRES incremental triangular factor is identically zero".into(),
                  ));
              }
              let diagonal_tolerance = 100.0 * f64::EPSILON * diagonal_scale;
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one back-substitution scale block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          import_anchor = "    use crate::small::least_squares;\n"
          import_line = "    use rodas5p_core::{DenseOperator, IdentityPreconditioner};\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("test import anchor mismatch")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          tests = r'''

              #[test]
              fn triangular_backsolve_rejects_an_identically_zero_factor() {
                  let r = DenseMatrix::zeros(1, 1);
                  let mut coefficients = [0.0; 1];
                  let error = back_substitute(&r, &[1.0], 1, &mut coefficients).unwrap_err();
                  assert!(matches!(error, CoreError::LinearSolve(_)));
              }

              #[test]
              fn uniformly_scaled_identity_preserves_solution_and_convergence() {
                  let solve = |alpha: f64| {
                      let matrix = DenseMatrix::from_rows(&[&[alpha, 0.0], &[0.0, alpha]]).unwrap();
                      let operator = DenseOperator::new(matrix).unwrap();
                      let preconditioner = IdentityPreconditioner::new(2);
                      let rhs = [alpha, -2.0 * alpha];
                      let config = GmresConfig {
                          restart: 2,
                          max_arnoldi: 2,
                          rtol: 1.0e-12,
                          atol: 0.0,
                      };
                      let mut counters = WorkCounters::default();
                      let report = solve_gmres_givens(
                          &operator,
                          &preconditioner,
                          &rhs,
                          None,
                          &config,
                          &mut counters,
                      )
                      .expect("scaled identity GMRES-Givens solve");
                      (report, counters, rhs, config)
                  };

                  let (unscaled, unscaled_work, unscaled_rhs, unscaled_config) = solve(1.0);
                  let (scaled, scaled_work, scaled_rhs, scaled_config) = solve(1.0e-15);
                  let expected = [1.0, -2.0];

                  for (report, rhs, config) in [
                      (&unscaled, &unscaled_rhs, &unscaled_config),
                      (&scaled, &scaled_rhs, &scaled_config),
                  ] {
                      let error: Vec<f64> = report
                          .x
                          .iter()
                          .zip(expected)
                          .map(|(actual, exact)| actual - exact)
                          .collect();
                      let threshold = config.atol.max(config.rtol * safe_l2(rhs));
                      assert!(safe_l2(&error) <= 64.0 * f64::EPSILON * safe_l2(&expected));
                      assert!(report.residual_norm <= threshold);
                      assert_eq!(report.iterations, 1);
                  }

                  let parity_error: Vec<f64> = unscaled
                      .x
                      .iter()
                      .zip(&scaled.x)
                      .map(|(left, right)| left - right)
                      .collect();
                  assert!(safe_l2(&parity_error) <= 64.0 * f64::EPSILON * safe_l2(&expected));
                  assert_eq!(
                      unscaled_work.linear_iterations,
                      scaled_work.linear_iterations
                  );
                  assert_eq!(unscaled_work.linear_matvecs, scaled_work.linear_matvecs);
              }
          '''
          if "uniformly_scaled_identity_preserves_solution_and_convergence" in text:
              raise SystemExit("scaled-identity regression already exists unexpectedly")
          stripped = text.rstrip()
          if not stripped.endswith("}"):
              raise SystemExit("test module final brace not found")
          text = stripped[:-1] + tests + "\n}\n"
          source_path.write_text(text, encoding="utf-8")
          workflow_path.unlink()
          PY

      - name: Format and execute the corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt
          rustup override set 1.94.1
          cargo fmt --all
          cargo test -p rodas5p-krylov --lib --locked
          git diff --check
          test "$(git hash-object crates/rodas5p-krylov/src/gmres_givens.rs)" = "af0285da3c0a5a593566408b56f124e54805e2b4"

      - name: Publish ordinary non-force bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rodas5p-krylov/src/gmres_givens.rs
          git add -u .github/workflows/pr19-scale-invariant-backsolve-autopatch.yml
          git commit -m "fix: make Givens backsolve scale invariant"
          git push origin HEAD:research/a2-a3-gmres-inner-cycle-givens
