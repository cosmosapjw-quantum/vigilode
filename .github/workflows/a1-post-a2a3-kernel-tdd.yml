name: A1 post-A2A3 kernel implementation bootstrap

on:
  push:
    branches:
      - research/a1-post-a2a3-kernel-rerun
    paths:
      - ".github/workflows/a1-post-a2a3-kernel-tdd.yml"
      - "tools/.a1-bootstrap-payload.part*"
      - "crates/rodas5p-integrators/tests/a1_post_a2a3_kernel_contracts.rs"
      - "crates/rodas5p-cli/src/bin/a1_post_a2a3_kernel_cell.rs"
      - "tools/run-a1-post-a2a3-kernel-cell.py"
      - "tools/summarize-a1-post-a2a3-kernel.py"
      - "tools/test_a1_post_a2a3_kernel.py"
      - ".github/workflows/a1-post-a2a3-kernel-matrix.yml"

permissions:
  contents: write

env:
  AUTHORITY_BASE_SHA: 8d0c79184e09efb5bdadc24a6315c60a71a44264
  AUTHORITY_BASE_TREE: acd94364cf69f19d782619fc6c75554cb0754208
  RED_COMMIT_SHA: 7c02406c0c6e0a2c39b2933041a8bf1df506ae7b
  ACTIVE_BRANCH: research/a1-post-a2a3-kernel-rerun

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and freeze authority before mutation
        run: |
          test "$GITHUB_REF_NAME" = "$ACTIVE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$AUTHORITY_BASE_SHA^{tree}")" = "$AUTHORITY_BASE_TREE"
          git merge-base --is-ancestor "$AUTHORITY_BASE_SHA" HEAD
          git merge-base --is-ancestor "$RED_COMMIT_SHA" HEAD
          git fetch --no-tags origin "$ACTIVE_BRANCH"
          test "$(git rev-parse "origin/$ACTIVE_BRANCH")" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Install Rust 1.94.1
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup component add --toolchain 1.94.1 rustfmt
          rustup override set 1.94.1
          rustc --version
          cargo --version

      - name: Expand the checksum-gated payload and apply the minimal routing patch
        run: |
          cat tools/.a1-bootstrap-payload.part* | base64 --decode > /tmp/a1-kernel-bootstrap.zip
          echo "53e7f0fd0bcefd6a971e58a70d94b300be195a2731ddb7ff2b1479e1608f5590  /tmp/a1-kernel-bootstrap.zip" | sha256sum -c -
          python3 - /tmp/a1-kernel-bootstrap.zip <<'PY'
          import os, pathlib, sys, zipfile
          root = pathlib.Path.cwd()
          expected = {
              ".github/workflows/a1-post-a2a3-kernel-matrix.yml",
              "__apply_patch.py",
              "crates/rodas5p-cli/src/bin/a1_post_a2a3_kernel_cell.rs",
              "tools/run-a1-post-a2a3-kernel-cell.py",
              "tools/summarize-a1-post-a2a3-kernel.py",
              "tools/test_a1_post_a2a3_kernel.py",
          }
          with zipfile.ZipFile(sys.argv[1]) as archive:
              members = {item.filename for item in archive.infolist() if not item.is_dir()}
              if members != expected:
                  raise SystemExit(f"unexpected bootstrap members: {sorted(members)}")
              for member in sorted(members - {"__apply_patch.py"}):
                  target = root / member
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(member))
              source = archive.read("__apply_patch.py")
          exec(compile(source, "<embedded-a1-routing-patch>", "exec"), {"__name__": "__main__"})
          for relative in [
              "tools/run-a1-post-a2a3-kernel-cell.py",
              "tools/summarize-a1-post-a2a3-kernel.py",
              "tools/test_a1_post_a2a3_kernel.py",
          ]:
              os.chmod(root / relative, 0o755)
          PY

      - name: Format and enforce frozen-scope guards
        run: |
          cargo fmt --all
          git diff --check
          git diff --exit-code "$GITHUB_SHA" -- \
            Cargo.lock Cargo.toml .cargo \
            crates/rodas5p-core crates/rodas5p-krylov crates/rodas5p-fair-ab \
            fixtures research/a1_inner_tolerance_audit_20260825
          git diff --exit-code "$GITHUB_SHA" -- \
            crates/rodas5p-integrators/src/g4_s5b0_inner_tolerance.rs
          source_file=crates/rodas5p-integrators/src/g4_s5b0_regime_atlas.rs
          for token in \
            V25_ERROR_DROP_THRESHOLD \
            'PersistenceLatch::new(3)' \
            V29_PREFIX_RESERVE_JVP \
            V29_PREFIX_BUDGET_FRACTION \
            V36_FROZEN_ZETA34_TAU \
            V37_CONTINUATION_JVP_CAP
          do
            test "$(git show "$AUTHORITY_BASE_SHA:$source_file" | grep -F "$token")" = \
              "$(grep -F "$token" "$source_file")"
          done

      - name: Verify focused RED-to-GREEN contract
        run: |
          cargo test --locked -p rodas5p-integrators \
            --test a1_post_a2a3_kernel_contracts -- --nocapture

      - name: Verify adjacent tolerance and matrix-free contracts
        run: |
          cargo test --locked -p rodas5p-integrators \
            --test a1_inner_tolerance_parity_contracts -- --nocapture
          cargo test --locked -p rodas5p-integrators \
            --test matrix_free_problem_contracts -- --nocapture

      - name: Verify failure-preserving Python tooling
        run: python3 tools/test_a1_post_a2a3_kernel.py -v

      - name: Compile the complete affected workspace
        run: cargo check --workspace --all-targets --locked

      - name: Commit and push the verified implementation without force
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=no | grep '^.. Cargo.lock$' || true)"
          git config user.name "cosmosapjw-quantum"
          git config user.email "58155957+cosmosapjw-quantum@users.noreply.github.com"
          rm -f .github/workflows/a1-post-a2a3-kernel-tdd.yml tools/.a1-bootstrap-payload.part*
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "research(a1): add receipt-only GMRES kernel routing"
          git fetch --no-tags origin "$ACTIVE_BRANCH"
          test "$(git rev-parse "origin/$ACTIVE_BRANCH")" = "$GITHUB_SHA"
          git push origin "HEAD:$ACTIVE_BRANCH"
