name: Audit2 matrix-free exact-source import
on:
  push:
    branches: [connectivity/audit2-matrix-free-20260830-head]
permissions:
  contents: read
jobs:
  export-exact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 981bf1bc2fa80216bad00495dd6c72b5fcf65ba3
          fetch-depth: 0
          persist-credentials: false
      - name: Recover the already-published PR33 source without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 981bf1bc2fa80216bad00495dd6c72b5fcf65ba3
          test "$(git rev-parse HEAD^{tree})" = b08221dd389ab765743b8ab0144c3a381d23f097
          mkdir -p "$RUNNER_TEMP/exact-source"
          git branch export-981bf1b HEAD
          git bundle create "$RUNNER_TEMP/exact-source/source.bundle" export-981bf1b
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/exact-source/source-identity.txt"
          sha256sum Cargo.lock > "$RUNNER_TEMP/exact-source/lock.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: audit2-matrix-free-source-981bf1b
          path: ${{ runner.temp }}/exact-source/
          retention-days: 7
