name: RVJ audit exact patch intake

on:
  push:
    branches: [audit/rvj-native-followup-20261003]
    paths: [docs/reviews/20261003_native_reaudit/PATCH_PAYLOAD.json.gz.b64]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'cosmosapjw-quantum/vigilode'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only the exact locally tested source payload
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5a8d7fe9ffc681bca98a98a2f9889a2a05505783 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess, tempfile
          directory = pathlib.Path('docs/reviews/20261003_native_reaudit/patch_parts')
          parts = sorted(directory.glob('*.b64'))
          assert [p.name for p in parts] == [f'{i:02}.b64' for i in range(8)]
          raw = gzip.decompress(base64.b64decode(b''.join(p.read_bytes() for p in parts)))
          assert hashlib.sha256(raw).hexdigest() == 'b75bfc89846dc9185c41f71d3602fabcf96895ce3698d536a35203b1b3ae5720'
          data = json.loads(raw)
          patch = data['patch'].encode()
          assert hashlib.sha256(patch).hexdigest() == data['manifest']['patch_sha256']
          rows = data['manifest']['files']
          assert len(rows) == 12
          for row in rows:
              p = pathlib.Path(row['path'])
              assert str(p).startswith(('crates/', 'tools/')) and '..' not in p.parts
              assert not p.is_symlink()
              expected = row['before_sha256']
              assert (not p.exists()) if expected is None else (hashlib.sha256(p.read_bytes()).hexdigest() == expected)
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch); f.flush()
              subprocess.run(['git', 'apply', '--check', f.name], check=True)
              subprocess.run(['git', 'apply', f.name], check=True)
          for row in rows:
              assert hashlib.sha256(pathlib.Path(row['path']).read_bytes()).hexdigest() == row['after_sha256']
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--'] + [r['path'] for r in rows], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == {r['path'] for r in rows}
          PY
      - name: Native regression verification before commit
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustup override set 1.94.1
          cargo test --locked -p rodas5p-core --test native_reaudit_laguerre_contracts
          cargo test --locked -p rodas5p-integrators --features audit2-research --test native_reaudit_cache_contracts --test native_reaudit_radius_contracts --test native_reaudit_chart_transport
          python3 -m pip install 'sympy==1.14.0' 'mpmath==1.3.0'
          python3 tools/test_native_reaudit_chart_domain.py -v
          git diff --exit-code -- Cargo.lock Cargo.toml research/LEDGER.jsonl fixtures
      - name: Ordinary review-branch commit; remove the one-shot writer and payload
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rvj-audit-apply-exact-patch.yml docs/reviews/20261003_native_reaudit/PATCH_PAYLOAD.json.gz.b64
          git rm -r docs/reviews/20261003_native_reaudit/patch_parts
          git config user.name 'VigilODE native audit'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(audit): bind frozen state and validate certificate inputs; add physical chart error transport'
          git push origin HEAD:refs/heads/audit/rvj-native-followup-20261003
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
