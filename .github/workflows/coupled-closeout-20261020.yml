name: Coupled native review and frozen closeout
on:
  push:
    branches: [research/coupled-matrix-free-rust-20261020]
    paths:
      - '.github/workflows/coupled-closeout-20261020.yml'
      - 'research/coupled_native_20261020/closeout/**'
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: CodeRabbit prerequisites and requested review
        run: |
          OUT="research/coupled_native_20261020/closeout_runs/${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          python3 research/coupled_native_20261020/closeout/coderabbit.py "$OUT" > "$OUT/review_execution.log" 2>&1
      - name: Validate frozen numerical observations
        if: always()
        run: |
          OUT="research/coupled_native_20261020/closeout_runs/${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          python3 research/coupled_native_20261020/closeout/validate.py "$OUT" > "$OUT/validation.log" 2>&1
      - name: Preserve closeout receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="research/coupled_native_20261020/closeout_runs/${GITHUB_RUN_ID}"
          [[ -d "$OUT" ]] || exit 0
          (cd "$OUT"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "research: retain coupled closeout ${GITHUB_RUN_ID} [skip ci]"
            git fetch origin research/coupled-matrix-free-rust-20261020
            git rebase origin/research/coupled-matrix-free-rust-20261020
            git push origin HEAD:refs/heads/research/coupled-matrix-free-rust-20261020
          fi
