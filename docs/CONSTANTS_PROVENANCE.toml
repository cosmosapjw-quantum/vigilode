# Provenance of every policy constant that decides a research verdict
# (audit F-046). `crates/rodas5p-integrators/tests/constants_provenance_contracts.rs`
# keeps this table in sync with the source: each value must equal the source
# literal bit for bit, and every `V<digits>_` constant of the atlas must have
# a row.
#
# class: derived | fitted | declared | cited | unsourced
#   derived   - follows from a stated derivation in the tree
#   fitted    - selected on data; fit_dataset, n and selection_criterion say how
#   declared  - chosen by the author as a rule; no derivation claimed
#   cited     - taken from a cited external source
#   unsourced - no derivation or fit artifact exists in the tree
# Any claim that depends on an unsourced constant, or on a fitted constant
# with n < 30, inherits that label.
# status: active | frozen | retired

