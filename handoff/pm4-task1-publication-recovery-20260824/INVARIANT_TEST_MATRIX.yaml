schema: vigilode-pm4-invariant-test-matrix/v1
matrix:
  - invariant: INV-01 no exact package-count gate
    positive: valid 262 fixture accepted
    alternative_positive: valid 308 fixture accepted
    negative: publication script contains literal expected package count
    expected: positives pass; source-contract negative fails
  - invariant: INV-02 directory metadata complete
    positive: every immediate package dir has .cargo-checksum.json
    negative: remove one checksum record
    expected: helper rejects with named missing package
  - invariant: INV-03 required observed dependency present
    positive: faer-0.24.4 exists
    negative: omit faer-0.24.4
    expected: helper rejects before Cargo
  - invariant: INV-04 Cargo proves closure
    positive: cargo metadata --frozen --format-version 1 on actual vendor
    negative: point symlink at incomplete fixture
    expected: actual passes; incomplete fails without network
  - invariant: INV-05 config and lock remain immutable
    positive: pre/post SHA equality
    negative: modify Cargo.lock in rehearsal
    expected: transaction stops before push
  - invariant: INV-06 Task-1 bytes immutable
    positive: patch and final file hashes match
    negative: mutate one byte in module
    expected: transaction stops before tests or push
  - invariant: INV-07 exact repository surface
    positive: M/A/A/D exact four paths
    negative: add any fifth path or leave recovery marker
    expected: transaction stops
  - invariant: INV-08 evidence before remote mutation
    positive: metadata/tests/compile/clippy/fmt/diff/ref gates precede push
    negative: move push earlier in fixture script
    expected: static acceptance test fails
  - invariant: INV-09 remote update semantics
    positive: normal fast-forward from expected feature head
    negative: feature drift or force flag
    expected: transaction stops; remote unchanged
  - invariant: INV-10 receipt honesty
    positive: observed count and metadata hash are recorded dynamically
    negative: hard-coded 262 or missing metadata hash
    expected: receipt contract fails
  - invariant: INV-11 handoff referential closure
    positive: every templates/ and acceptance/ path named by load-bearing documents exists and parses
    negative: delete templates/COMPLETION_EVIDENCE_SCHEMA.json or rename a referenced acceptance test
    expected: test_handoff_completeness_contract fails before R5 implementation or remote mutation
  - invariant: INV-12 completion evidence is success-only and mechanically closed
    positive: COMPLETION_EVIDENCE_EXAMPLE.json passes the schema and executable semantic validator
    negative: set merge_performed=true, omit a required command record, retain a P0/P1 finding, or leave unresolved blockers
    expected: completion-evidence validators reject the object
