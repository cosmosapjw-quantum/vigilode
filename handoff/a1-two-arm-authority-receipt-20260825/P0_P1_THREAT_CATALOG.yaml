schema: vigilode-a1-threat-catalog/v2

p0:
  - id: P0-01
    threat: outer-scaled arm becomes the ordinary committed runtime arm before a separately approved activation node
    guard: committed-arm constant and ordinary runtime tests remain legacy-fixed
  - id: P0-02
    threat: tau, persistence, prefix budget, or continuation budget is retuned to make the candidate pass
    guard: exact-value/source-diff assertions against starting head
  - id: P0-03
    threat: historical v3.5-v3.7 evidence is rewritten or treated as candidate evidence without replay
    guard: historical paths forbidden; receipt records legacy-only applicability
  - id: P0-04
    threat: incomplete or duplicated 12-cell matrix is accepted
    guard: exact two-arm by six-family key-set validation
  - id: P0-05
    threat: aggregate trusts derived cell totals and hides atomic event or recommendation rows
    guard: recompute totals, sets, safety, margins, and verdict from atomic rows
  - id: P0-06
    threat: unsafe recommendation or loss of the Hires positive control is omitted
    guard: explicit per-arm unsafe keys and positive-control classification
  - id: P0-07
    threat: candidate verdict is changed by wall time, packaging metadata, or archive SHA
    guard: decision uses only deterministic scientific and work fields
  - id: P0-08
    threat: artifact and committed receipt bind different scientific execution identities or atomic cells
    guard: exact execution head/tree/toolchain and per-cell content manifest comparison

p1:
  - id: P1-01
    threat: candidate arm leaks into non-receipt production APIs
    guard: explicit receipt-mode API and negative ordinary-path test
  - id: P1-02
    threat: JSON ordering or optional-value handling is nondeterministic
    guard: stable ordering, schema version, null/nonfinite rules, permutation tests
  - id: P1-03
    threat: one family or one arm lacks provenance, limits, or hard-gate fields
    guard: schema completeness validation for every cell
  - id: P1-04
    threat: workflow passes while aggregate negative cases are untested
    guard: missing/duplicate/extra/tampered/mismatched-tau adversarial tests
  - id: P1-05
    threat: PR body or Atlassian mirror claims completion before receipt-commit closure and fresh review
    guard: refresh only after externally recorded A1/E4/receipt-validation GREEN
  - id: P1-06
    threat: committed receipt is required to embed its own commit/tree or a post-receipt workflow run, creating an infinite provenance loop
    guard: freeze scientific execution identity in the receipt and keep receipt-commit plus later verification identities external
  - id: P1-07
    threat: load-bearing scientific code changes after the execution workflow but old artifacts are retained
    guard: source-diff gate invalidates artifacts and requires a new scientific execution head

accepted_deferred:
  - semantic forward-error versus residual/backward-error contract
  - G1/G3 comparator scope
  - A2 inner-cycle convergence
  - A3 incremental Givens and repeated-QR removal
  - timing protocol and ranking authority
  - candidate-arm activation
